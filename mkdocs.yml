site_name: CMS PHY DET Analysis
site_url: https://cms-phy-det-analysis.docs.cern.ch/
site_description: Project hub, daily development logs, wikis, and AI-assisted analysis documentation.
site_author: CMS PHY DET Analysis Team

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Ask AI: ask.md
  - Shared Resources:
      - Wiki Overview: wiki/index.md
      - EOS Guide: wiki/eos.md
      - GitLab Guide: wiki/gitlab.md
      - CMS Analysis: wiki/cms-analysis.md
  - Templates & Rules:
      - Daily Log Template: doc-templates/daily-log-template.md
      - Project Template: doc-templates/project-template.md
      - Meeting Template: doc-templates/meeting-template.md
      - Agent Rules: ai/agent-rules.md
      - Editing Policy: ai/editing-policy.md
      - Roadmap: ai/roadmap.md
  - External Index: external-index.md

validation:
  nav:
    omitted_files: ignore


